services:
  - type: web
    name: highway-safety-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/incidents
    autoDeploy: true
    envVars:
      - key: VIDEO_SOURCE
        value: demo_videos/drone/DJI_0011.MP4
      - key: ENABLE_SIMULATION
        value: "0"
      - key: PARALLEL_API_KEY
        sync: false
