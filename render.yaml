services:
  - type: web
    name: highway-safety-agent-docker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/incidents
    autoDeploy: true
    envVars:
      - key: VIDEO_SOURCE
        value: /tmp/highway-demo-video-missing.mp4
      - key: ENABLE_SIMULATION
        value: "0"
      - key: PARALLEL_API_KEY
        sync: false
